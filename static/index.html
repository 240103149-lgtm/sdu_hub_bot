<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>University Knowledge Hub</title>
<style>
  :root {
    --paper: #f3f6f5;
    --surface: #ffffff;
    --ink: #17212b;
    --muted: #586674;
    --line: #d5dde2;
    --brand: #1d4e89;
    --brand-ink: #ffffff;
    --error-bg: #fdecec;
    --error-ink: #8a1f1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #10161c;
      --surface: #18212a;
      --ink: #e7ecf0;
      --muted: #9aa7b2;
      --line: #2a3540;
      --brand: #6fa8e8;
      --brand-ink: #0b1520;
      --error-bg: #3a1c1c;
      --error-ink: #f3b4b4;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px 0;
  }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  header h1 { margin: 0; font-size: 1.25rem; font-weight: 650; }

  .langs { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lang {
    appearance: none; background: none; border: 0; cursor: pointer; font: inherit; font-size: .9rem;
    color: var(--muted); padding: 6px 12px;
  }
  .lang + .lang { border-left: 1px solid var(--line); }
  .lang[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); font-weight: 600; }

  .tabs { display: flex; gap: 4px; }
  .tab {
    appearance: none; background: none; border: 0; cursor: pointer;
    padding: 10px 14px; font: inherit; color: var(--muted);
    border-bottom: 3px solid transparent;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); font-weight: 600; }

  main { flex: 1; min-height: 0; display: flex; }
  .panel { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .panel.active { display: flex; }

  /* Chat */
  .messages { flex: 1; overflow-y: auto; padding: 20px; }
  .thread { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .empty { max-width: 720px; margin: 8vh auto 0; }
  .empty[hidden] { display: none; }
  .empty h2 { margin: 0 0 6px; font-size: 1.35rem; }
  .empty p { margin: 0 0 16px; color: var(--muted); max-width: 60ch; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    appearance: none; cursor: pointer; font: inherit; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px;
  }
  .chip:hover { border-color: var(--brand); }

  .msg {
    max-width: 85%; padding: 10px 14px; border-radius: 14px;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.user { align-self: flex-end; background: var(--brand); color: var(--brand-ink); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.pending { color: var(--muted); }
  .msg.error { background: var(--error-bg); color: var(--error-ink); border-color: transparent; }

  .composer { border-top: 1px solid var(--line); background: var(--surface); padding: 12px 20px; }
  .composer form { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; max-height: 140px;
  }
  .send {
    appearance: none; cursor: pointer; font: inherit; font-weight: 600;
    background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 10px; padding: 10px 18px;
  }
  .send:disabled { opacity: .55; cursor: not-allowed; }

  /* Guide */
  .guide { flex: 1; overflow-y: auto; padding: 24px 20px 40px; }
  .guide-body { max-width: 68ch; margin: 0 auto; }
  .guide-body h2 { font-size: 1.4rem; margin: 0 0 12px; }
  .guide-body h3 { font-size: 1.1rem; margin: 26px 0 8px; }
  .guide-body p, .guide-body li { margin: 0 0 6px; }
  .guide-body ol, .guide-body ul { padding-left: 1.4em; margin: 0 0 8px; }
  .guide-body ol li { padding-left: 4px; }

  @media (max-width: 520px) {
    .msg { max-width: 92%; }
    header, .messages, .composer, .guide { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 data-i18n="title">University Knowledge Hub</h1>
    <div class="langs" role="group" aria-label="Language">
      <button class="lang" type="button" data-lang="kk">Қазақша</button>
      <button class="lang" type="button" data-lang="ru">Русский</button>
      <button class="lang" type="button" data-lang="en">English</button>
    </div>
  </div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-chat" aria-selected="true" aria-controls="panel-chat" data-i18n="tabChat">Ask a question</button>
    <button class="tab" role="tab" id="tab-guide" aria-selected="false" aria-controls="panel-guide" data-i18n="tabGuide">Schedule creation guide</button>
  </div>
</header>

<main>
  <section class="panel active" id="panel-chat" role="tabpanel" aria-labelledby="tab-chat">
    <div class="messages" id="messages" aria-live="polite">
      <div class="empty" id="empty">
        <h2 data-i18n="emptyTitle">Ask about the university</h2>
        <p data-i18n="emptyText">You can write in Kazakh, Russian or English.</p>
        <div class="chips" id="chips"></div>
      </div>
      <div class="thread" id="thread"></div>
    </div>
    <div class="composer">
      <form id="form">
        <textarea id="input" rows="1"></textarea>
        <button class="send" id="send" type="submit" data-i18n="send">Send</button>
      </form>
    </div>
  </section>

  <section class="panel" id="panel-guide" role="tabpanel" aria-labelledby="tab-guide">
    <div class="guide"><div class="guide-body" id="guide-body"></div></div>
  </section>
</main>

<script>
  const I18N = {
    kk: {
      title: "Университет білім орталығы",
      tabChat: "Сұрақ қою",
      tabGuide: "Расписание құру нұсқаулығы",
      emptyTitle: "Университет туралы сұраңыз",
      emptyText: "Қазақша, орысша немесе ағылшынша жаза аласыз. Жауап университеттің бекітілген құжаттарына негізделеді.",
      chips: ["Расписание қалай құрамын?", "Расписание құру мерзімі қашан бітеді?", "Пререквизит орындалмаса не істеймін?"],
      placeholder: "Сұрағыңызды жазыңыз",
      inputLabel: "Сұрақ",
      send: "Жіберу",
      pending: "Жауап дайындалып жатыр…",
      offline: "Серверге қосыла алмадық. Терминалда сервер жұмыс істеп тұрғанын тексеріңіз.",
      unknownError: "Белгісіз қате шықты.",
      guideLoading: "Жүктелуде…",
      guideError: "Нұсқаулықты жүктей алмадық. knowledge/registration_guide.md файлы бар екенін тексеріп, бетті жаңартыңыз.",
    },
    ru: {
      title: "Университетский центр знаний",
      tabChat: "Задать вопрос",
      tabGuide: "Инструкция по составлению расписания",
      emptyTitle: "Спросите об университете",
      emptyText: "Можно писать на казахском, русском или английском. Ответы основаны на утверждённых документах университета.",
      chips: ["Как составить расписание?", "Когда заканчивается составление расписания?", "Что делать, если не выполнен пререквизит?"],
      placeholder: "Введите ваш вопрос",
      inputLabel: "Вопрос",
      send: "Отправить",
      pending: "Готовлю ответ…",
      offline: "Не удалось подключиться к серверу. Проверьте, что сервер запущен в терминале.",
      unknownError: "Произошла неизвестная ошибка.",
      guideLoading: "Загрузка…",
      guideError: "Не удалось загрузить инструкцию. Проверьте, что файл knowledge/registration_guide.md существует, и обновите страницу.",
    },
    en: {
      title: "University Knowledge Hub",
      tabChat: "Ask a question",
      tabGuide: "Schedule creation guide",
      emptyTitle: "Ask about the university",
      emptyText: "You can write in Kazakh, Russian or English. Answers are based on the university's approved documents.",
      chips: ["How do I create my schedule?", "When does schedule creation close?", "What if I don't meet a prerequisite?"],
      placeholder: "Type your question",
      inputLabel: "Question",
      send: "Send",
      pending: "Preparing an answer…",
      offline: "Couldn't reach the server. Check that the server is running in the terminal.",
      unknownError: "An unknown error occurred.",
      guideLoading: "Loading…",
      guideError: "Couldn't load the guide. Check that knowledge/registration_guide.md exists and refresh the page.",
    },
  };

  const history = [];
  let busy = false;
  let guideLoaded = false;
  let lang = pickInitialLang();

  const $ = (id) => document.getElementById(id);
  const thread = $("thread"), messages = $("messages"), input = $("input"), sendBtn = $("send");
  const t = (key) => I18N[lang][key];

  function pickInitialLang() {
    try {
      const saved = localStorage.getItem("lang");
      if (saved && I18N[saved]) return saved;
    } catch { /* storage may be unavailable */ }
    const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return I18N[nav] ? nav : "en";
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t("title");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    input.placeholder = t("placeholder");
    input.setAttribute("aria-label", t("inputLabel"));
    document.querySelectorAll(".lang").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

    const chips = $("chips");
    chips.textContent = "";
    t("chips").forEach((text) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = text;
      b.addEventListener("click", () => send(text));
      chips.appendChild(b);
    });

    guideLoaded = false;
    if ($("panel-guide").classList.contains("active")) loadGuide();
  }

  document.querySelectorAll(".lang").forEach((b) =>
    b.addEventListener("click", () => {
      lang = b.dataset.lang;
      try { localStorage.setItem("lang", lang); } catch { /* ignore */ }
      applyLang();
    }));

  /* --- text rendering (DOM only, no innerHTML) --- */
  function renderInline(parent, text) {
    text.split(/\*\*(.+?)\*\*/g).forEach((part, i) => {
      if (i % 2) {
        const s = document.createElement("strong");
        s.textContent = part;
        parent.appendChild(s);
      } else {
        parent.appendChild(document.createTextNode(part));
      }
    });
  }
  function renderRich(parent, text) {
    parent.textContent = "";
    renderInline(parent, text.replace(/^(\s*)[*-]\s+/gm, "$1• "));
  }

  /* --- chat --- */
  function addMessage(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    renderRich(el, text);
    thread.appendChild(el);
    messages.scrollTop = messages.scrollHeight;
    return el;
  }

  async function send(raw) {
    const text = raw.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    $("empty").hidden = true;

    addMessage("user", text);
    const pending = addMessage("bot", t("pending"));
    pending.classList.add("pending");
    input.value = "";
    input.style.height = "auto";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history.slice(-10), lang }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || t("unknownError"));
      pending.classList.remove("pending");
      renderRich(pending, data.reply);
      history.push({ role: "user", text }, { role: "assistant", text: data.reply });
    } catch (err) {
      pending.classList.remove("pending");
      pending.classList.add("error");
      renderRich(pending, err instanceof TypeError ? t("offline") : err.message);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      messages.scrollTop = messages.scrollHeight;
      input.focus();
    }
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  });

  /* --- tabs --- */
  function showTab(name) {
    ["chat", "guide"].forEach((n) => {
      $("panel-" + n).classList.toggle("active", n === name);
      $("tab-" + n).setAttribute("aria-selected", String(n === name));
    });
    if (name === "guide" && !guideLoaded) loadGuide();
  }
  $("tab-chat").addEventListener("click", () => showTab("chat"));
  $("tab-guide").addEventListener("click", () => showTab("guide"));

  /* --- registration guide (US3) --- */
  function renderGuide(container, text) {
    container.textContent = "";
    let list = null, listType = null;
    const closeList = () => { list = null; listType = null; };
    const addItem = (type, content) => {
      if (listType !== type) {
        list = document.createElement(type);
        listType = type;
        container.appendChild(list);
      }
      const li = document.createElement("li");
      renderInline(li, content);
      list.appendChild(li);
    };
    for (const raw of text.split("\n")) {
      const line = raw.trim();
      if (!line || line.startsWith("<!--")) { closeList(); continue; }
      let m;
      if ((m = line.match(/^(#{1,3})\s+(.*)/))) {
        closeList();
        const h = document.createElement(m[1].length === 1 ? "h2" : "h3");
        renderInline(h, m[2]);
        container.appendChild(h);
      } else if ((m = line.match(/^\d+\.\s+(.*)/))) {
        addItem("ol", m[1]);
      } else if ((m = line.match(/^[-*]\s+(.*)/))) {
        addItem("ul", m[1]);
      } else {
        closeList();
        const p = document.createElement("p");
        renderInline(p, line);
        container.appendChild(p);
      }
    }
  }
  async function loadGuide() {
    const body = $("guide-body");
    body.textContent = t("guideLoading");
    const requestedLang = lang;
    try {
      const res = await fetch("/api/guide?lang=" + requestedLang);
      if (!res.ok) throw new Error();
      const text = await res.text();
      if (requestedLang !== lang) return; // language changed while loading
      renderGuide(body, text);
      guideLoaded = true;
    } catch {
      if (requestedLang === lang) body.textContent = t("guideError");
    }
  }

  applyLang();
</script>
</body>
</html>
